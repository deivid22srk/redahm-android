name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed ReDAHM release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      NDK_VERSION: "28.2.13676358"
      JOBS: "3"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ninja-build cmake clang-18 \
            libx11-xcb-dev libasound2-dev libpulse-dev libwayland-dev \
            wayland-protocols libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxss-dev libdrm-dev libgbm-dev \
            libxtst-dev libxkbcommon-dev libudev-dev \
            nasm yasm zip unzip
          clang-18 --version | head -1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android NDK and SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" | head -5
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;${NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          ls "$ANDROID_HOME/ndk/${NDK_VERSION}/build/cmake/android.toolchain.cmake"

      - name: Cache rexglue host codegen tool
        uses: actions/cache@v4
        with:
          path: |
            native/build-host
            native/rexglue-sdk/out
          key: rexglue-host-v0.9.0-${{ runner.os }}-${{ hashFiles('native/rexglue-sdk/CMakeLists.txt', 'native/rexglue-sdk/cmake/**', 'native/rexglue-sdk/src/**', 'native/rexglue-sdk/tools/**') }}
          restore-keys: |
            rexglue-host-v0.9.0-${{ runner.os }}-

      - name: Build native code (host codegen + codegen + NDK arm64)
        env:
          CC: clang-18
          CXX: clang++-18
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          bash build-android.sh

      # The keystore never lives in the repository: it is stored as the
      # RELEASE_KEYSTORE_BASE64 secret and materialized only on the runner.
      - name: Decode signing keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "${RUNNER_TEMP}/redahm-release.keystore"
          ls -la "${RUNNER_TEMP}/redahm-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          REDAHM_KEYSTORE_FILE: ${{ runner.temp }}/redahm-release.keystore
          REDAHM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          REDAHM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          REDAHM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          ls -la app/build/outputs/apk/release/

      - name: Verify APK signature
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs -v "$APK"

      - name: Upload signed APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: redahm-android-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-native-build-logs
          path: |
            native/build-host/cmake.log
            native/build-host/build.log
            native/build-host/build.ninja
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v0.1.0"; fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "redahm-android-release-${TAG}.apk"
          gh release create "$TAG" "redahm-android-release-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "ReDAHM Android ${TAG}" \
            --notes "Signed release APK (arm64-v8a), built from ${GITHUB_SHA:0:12}." \
            --target "$GITHUB_SHA" \
          || gh release upload "$TAG" "redahm-android-release-${TAG}.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
